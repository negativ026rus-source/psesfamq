<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Информация о проверках — ПСЭС</title>
  <style>
    :root {
      --bg: #080b11;
      --card: #151922;
      --card-light: #1d2330;
      --border: #343d4d;
      --text: #f1f4fa;
      --muted: #a7adba;
      --cyan: #31d7ff;
      --purple: #7654df;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px 50px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 0%, rgba(0, 177, 255, .14), transparent 38%),
        var(--bg);
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--cyan);
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover { text-decoration: underline; }

    header {
      margin-bottom: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 90% 10%, rgba(49, 215, 255, .18), transparent 40%),
        linear-gradient(135deg, #172235, #11151e);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .3);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 38px);
    }

    header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .schedule {
      display: grid;
      gap: 12px;
    }

    .check-card {
      display: grid;
      grid-template-columns: 76px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(115deg, var(--card-light), var(--card));
      box-shadow: 0 8px 22px rgba(0, 0, 0, .2);
    }

    .day {
      display: grid;
      width: 64px;
      height: 60px;
      place-items: center;
      border: 1px solid rgba(49, 215, 255, .55);
      border-radius: 12px;
      background: rgba(22, 135, 190, .15);
      color: var(--cyan);
      font-size: 16px;
      font-weight: 700;
    }

    .org {
      font-size: 18px;
      font-weight: 700;
    }

    .label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .time {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(49, 215, 255, .4);
      border-radius: 20px;
      background: rgba(33, 111, 163, .16);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .copy-button {
      min-width: 168px;
      padding: 9px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--purple);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: background .15s ease, transform .15s ease;
    }

    .copy-button:hover {
      transform: translateY(-1px);
      background: #6341d0;
    }

    .copy-button.secondary {
      border: 1px solid rgba(49, 215, 255, .45);
      background: #153347;
    }

    .copy-button.secondary:hover { background: #1b4b66; }

    .note {
      margin-top: 20px;
      padding: 14px 16px;
      border-left: 3px solid var(--purple);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      body { padding: 18px 12px 36px; }
      header { padding: 20px; }

      .check-card {
        grid-template-columns: 56px 1fr;
        gap: 12px;
        padding: 13px;
      }

      .day {
        width: 52px;
        height: 50px;
        font-size: 14px;
      }

      .org { font-size: 16px; }

      .card-actions {
        grid-column: 1 / -1;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .copy-button {
        flex: 1 1 140px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← На главную</a>

    <header>
      <h1>Информация о проверках</h1>
      <p>Расписание проверок организаций ПСЭС. Используйте кнопки рядом с нужной организацией.</p>
    </header>

    <section class="schedule" id="schedule" aria-label="Расписание проверок"></section>

    <div class="note">
      Время указано по расписанию проверок.
    </div>
  </main>

  <script>
    const hospitalDiscordText = `<@&1538939093151653944> <@&1544008424373751818>

## Дорогие Пэпсики!
** Уведомляю Вас о сборе на проверку, на наличие действующих мед.карт , у сотрудников "Больница". **
*Сбор состоится в 20:10, на задней парковке.*
*Проверка организации "Больница" состоится в 20:30*
**Присутствие в голосовом канале нашего отдела ОБЯЗАТЕЛЬНО! **
*Ждём тут https://discord.com/channels/1538939092929216603/1538939110469931134 *`;

    const armyDiscordText = `<@&1538939093151653944> <@&1544008424373751818>

## Дорогие Пэпсики!
** Уведомляю Вас о сборе на проверку, на наличие действующих мед.карт , у сотрудников "Армия". **
*Сбор состоится в 20:10, на задней парковке.*
*Проверка организации "Армия" состоится в 20:30*
**Присутствие в голосовом канале нашего отдела ОБЯЗАТЕЛЬНО! **
*Ждём тут https://discord.com/channels/1538939092929216603/1538939110469931134 *`;

    const armyRadioText = `/dep к Армия: Уведомляю Вас о том что, сегодня у вас в 20:30 будет проведена проверка медицинских справок согласно закону города Москвы "О Здравоохранении" Глава IV,ст.8,ч1,п.Г. Просим собрать состав к этому времени.`;

    const schedule = [
      {
        short: "ПН",
        day: "Понедельник",
        organization: "Больница",
        time: "20:30",
        discordText: hospitalDiscordText,
        noRadio: true
      },
      {
        short: "ВТ",
        day: "Вторник",
        organization: "Армия",
        time: "20:30",
        discordText: armyDiscordText,
        radioText: armyRadioText
      },
      {
        short: "СР",
        day: "Среда",
        organization: "Вести Москвы",
        time: "19:00"
      },
      {
        short: "ЧТ",
        day: "Четверг",
        organization: "ФСБ",
        time: "19:00"
      },
      {
        short: "ПТ",
        day: "Пятница",
        organization: "МВД",
        time: "19:00"
      },
      {
        short: "СБ",
        day: "Суббота",
        organization: "Правительство",
        time: "17:00"
      },
      {
        short: "СБ",
        day: "Суббота",
        organization: "ГИБДД",
        time: "19:00"
      }
    ];

    async function copyText(text, button, originalLabel) {
      let copied = false;

      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();

        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }

        textarea.remove();
      }

      button.textContent = copied ? "✅ Скопировано" : "❌ Ошибка";

      setTimeout(() => {
        button.textContent = originalLabel;
      }, 1800);

      if (!copied) {
        alert("Не удалось скопировать. Попробуйте скопировать текст вручную.");
      }
    }

    const container = document.getElementById("schedule");

    schedule.forEach(item => {
      const card = document.createElement("article");
      card.className = "check-card";

      const day = document.createElement("div");
      day.className = "day";
      day.textContent = item.short;

      const info = document.createElement("div");

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "Организация";

      const organization = document.createElement("div");
      organization.className = "org";
      organization.textContent = item.organization;

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = item.time;

      info.append(label, organization, time);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const discordLabel = `📋 Discord: ${item.organization}`;
      const discordButton = document.createElement("button");
      discordButton.type = "button";
      discordButton.className = "copy-button";
      discordButton.textContent = discordLabel;
      discordButton.addEventListener("click", () => {
        const text = item.discordText ||
          `${item.day} — ${item.organization} — ${item.time}`;

        copyText(text, discordButton, discordLabel);
      });

      actions.append(discordButton);

      if (!item.noRadio) {
        const radioLabel = `📻 /dep ${item.organization}`;
        const radioButton = document.createElement("button");
        radioButton.type = "button";
        radioButton.className = "copy-button secondary";
        radioButton.textContent = radioLabel;
        radioButton.addEventListener("click", () => {
          const text = item.radioText ||
            `/dep ${item.organization} — ${item.time}`;

          copyText(text, radioButton, radioLabel);
        });

        actions.append(radioButton);
      }

      card.append(day, info, actions);
      container.appendChild(card);
    });
  </script>
</body>
</html>
