<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Приёмный покой отдела ПСЭС ночью">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090911"/>
      <stop offset="1" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="gV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".38"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b40"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b14" stop-opacity="0"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <pattern id="tiles" width="72" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0 H72 M0 0 V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="b24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="gsm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <ellipse cx="240" cy="60" rx="360" ry="200" fill="url(#gV)" filter="url(#b24)"/>
  <ellipse cx="1010" cy="330" rx="330" ry="200" fill="url(#gT)" filter="url(#b24)"/>

  <rect x="0" y="24" width="1200" height="336" fill="#101019" opacity=".55"/>
  <rect x="0" y="24" width="1200" height="336" fill="url(#tiles)"/>

  <g fill="#ffffff" opacity=".35">
    <circle cx="150" cy="70" r="1.3"/>
    <circle cx="420" cy="46" r="1"/>
    <circle cx="700" cy="60" r="1.2"/>
    <circle cx="1130" cy="80" r="1"/>
  </g>

  <!-- окно с ночным городом -->
  <g>
    <rect x="912" y="58" width="252" height="212" rx="14" fill="#07070f" stroke="#33334c" stroke-width="2"/>
    <circle cx="1050" cy="104" r="20" fill="#4be1c4" opacity=".18"/>
    <circle cx="1050" cy="104" r="12" fill="#c9fff4" opacity=".35"/>
    <g fill="#111122">
      <rect x="928" y="176" width="42" height="76"/>
      <rect x="978" y="150" width="34" height="102"/>
      <rect x="1020" y="190" width="48" height="62"/>
      <rect x="1076" y="162" width="30" height="90"/>
      <rect x="1114" y="198" width="36" height="54"/>
    </g>
    <g fill="#8b7cff" opacity=".55">
      <rect x="936" y="188" width="7" height="9"/>
      <rect x="950" y="204" width="7" height="9"/>
      <rect x="984" y="164" width="7" height="9"/>
      <rect x="998" y="184" width="7" height="9"/>
      <rect x="1028" y="202" width="7" height="9"/>
      <rect x="1082" y="176" width="7" height="9"/>
    </g>
    <g fill="#4be1c4" opacity=".5">
      <rect x="950" y="230" width="7" height="9"/>
      <rect x="1040" y="216" width="7" height="9"/>
      <rect x="1122" y="212" width="7" height="9"/>
    </g>
    <path d="M1038 58 V270 M912 164 H1164" fill="none" stroke="#33334c" stroke-width="2"/>
  </g>

  <!-- светящийся крест -->
  <g filter="url(#gsm)">
    <rect x="120" y="54" width="46" height="46" rx="13" fill="#d94f6a"/>
    <rect x="138" y="63" width="10" height="28" rx="3" fill="#fff"/>
    <rect x="129" y="72" width="28" height="10" rx="3" fill="#fff"/>
  </g>

  <!-- стойка с монитором -->
  <g>
    <rect x="150" y="292" width="620" height="20" rx="6" fill="#33334a"/>
    <rect x="156" y="306" width="608" height="70" fill="url(#counter)"/>
    <rect x="156" y="306" width="608" height="70" fill="url(#tiles)" opacity=".6"/>
    <rect x="176" y="326" width="120" height="30" rx="5" fill="#1f1f30" stroke="#3d3d58"/>
    <rect x="316" y="326" width="84" height="30" rx="5" fill="#1b1b2a" stroke="#3d3d58"/>
    <rect x="420" y="326" width="120" height="30" rx="5" fill="#1b1b2a" stroke="#3d3d58"/>

    <rect x="392" y="146" width="268" height="146" rx="14" fill="url(#screen)" stroke="#3d3d58" stroke-width="2"/>
    <path d="M404 246 H470 L488 214 L508 268 L528 190 L548 246 H648"
      fill="none" stroke="#4be1c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      opacity=".9" filter="url(#gsm)"/>
    <g fill="#8b7cff" opacity=".6">
      <rect x="408" y="162" width="56" height="7" rx="3.5"/>
      <rect x="408" y="178" width="34" height="7" rx="3.5"/>
      <rect x="596" y="162" width="48" height="7" rx="3.5" opacity=".5"/>
    </g>
    <rect x="510" y="292" width="32" height="14" fill="#2a2a3d"/>
    <rect x="492" y="292" width="68" height="8" rx="4" fill="#33334a"/>
  </g>

  <!-- дверь с подсветкой -->
  <g>
    <rect x="832" y="96" width="60" height="214" rx="8" fill="#0b0b14" stroke="#33334c" stroke-width="2"/>
    <rect x="840" y="110" width="44" height="192" rx="6" fill="url(#glass)"/>
    <rect x="856" y="196" width="7" height="22" rx="3.5" fill="#c9fff4" opacity=".8"/>
    <ellipse cx="862" cy="300" rx="70" ry="22" fill="#4be1c4" opacity=".14" filter="url(#b10)"/>
  </g>

  <!-- стойка капельницы -->
  <g stroke="#3d3d58" stroke-width="3" stroke-linecap="round">
    <path d="M764 300 V148"/>
    <path d="M742 148 H786"/>
  </g>
  <g>
    <rect x="748" y="158" width="32" height="46" rx="8" fill="#4be1c4" opacity=".22"/>
    <rect x="750" y="176" width="28" height="26" rx="6" fill="#4be1c4" opacity=".35"/>
    <path d="M764 204 V244" stroke="#4be1c4" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <rect x="0" y="334" width="1200" height="66" fill="url(#floor)"/>
  <g opacity=".16" filter="url(#b10)">
    <rect x="912" y="336" width="252" height="46" fill="#4be1c4"/>
    <rect x="832" y="336" width="60" height="46" fill="#4be1c4"/>
    <rect x="120" y="336" width="46" height="40" fill="#8b7cff"/>
  </g>

  <g fill="#4be1c4">
    <circle cx="700" cy="120" r="2" opacity=".5"/>
    <circle cx="880" cy="330" r="1.6" opacity=".35"/>
    <circle cx="300" cy="120" r="1.8" opacity=".4"/>
  </g>
</svg>
