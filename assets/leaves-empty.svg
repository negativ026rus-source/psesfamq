<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Пустой список отпусков: зонт, чемодан и волны">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35354e"/>
      <stop offset="1" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4be1c4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="7 9"/>
  <circle cx="120" cy="120" r="66" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".6"/>

  <!-- зонт -->
  <g transform="translate(120 74)">
    <path d="M0 20 V70" stroke="#9c9cae" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 70 a10 10 0 0 0 14 8" fill="none" stroke="#9c9cae" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-48 18 A48 44 0 0 1 48 18 Z" fill="url(#canopy)" opacity=".85"/>
    <path d="M-32 18 A32 44 0 0 1 32 18 Z" fill="#0b0b13" opacity=".22"/>
    <path d="M0 -26 V18 M-16 -17 V18 M16 -17 V18" stroke="#0b0b13" stroke-opacity=".3" stroke-width="1.5"/>
    <circle cx="0" cy="-26" r="4" fill="#cbc6ff"/>
  </g>

  <!-- чемодан -->
  <g transform="translate(86 154) rotate(-7)" filter="url(#soft)">
    <path d="M22 -6 V-14 a14 14 0 0 1 28 0 V-6" fill="none" stroke="#4a4a68" stroke-width="4" stroke-linecap="round"/>
    <rect x="0" y="0" width="72" height="48" rx="10" fill="url(#case)" stroke="#4a4a68" stroke-width="1.5"/>
    <rect x="8" y="9" width="18" height="18" rx="5" fill="#d94f6a"/>
    <rect x="15" y="12" width="4" height="12" rx="1.5" fill="#fff"/>
    <rect x="11" y="16" width="12" height="4" rx="1.5" fill="#fff"/>
    <rect x="36" y="12" width="24" height="4" rx="2" fill="#4be1c4" opacity=".45"/>
    <rect x="36" y="21" width="16" height="4" rx="2" fill="#8b7cff" opacity=".45"/>
  </g>

  <!-- волны -->
  <g fill="none" stroke="#4be1c4" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round">
    <path d="M64 178 q9 -6 18 0 t18 0 t18 0 t18 0"/>
    <path d="M80 194 q9 -6 18 0 t18 0 t18 0"/>
  </g>

  <path d="M170 78 l4 4 l9 -11" fill="none" stroke="#4be1c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>

  <g fill="#4be1c4">
    <circle cx="54" cy="62" r="1.8" opacity=".5"/>
    <circle cx="196" cy="186" r="1.6" opacity=".4"/>
    <circle cx="62" cy="196" r="1.5" opacity=".45"/>
    <circle cx="186" cy="44" r="1.4" opacity=".5"/>
  </g>
</svg>
