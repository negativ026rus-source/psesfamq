<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Отпуск сотрудника ПСЭС: чемодан, календарь и море за окном">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090911"/>
      <stop offset="1" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="gV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1740"/>
      <stop offset=".62" stop-color="#16223c"/>
      <stop offset="1" stop-color="#0d3b40"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6f74"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e46"/>
      <stop offset="1" stop-color="#171724"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b40"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b14" stop-opacity="0"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <pattern id="tiles" width="72" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0 H72 M0 0 V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="days" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="20" rx="5" fill="#262638"/>
    </pattern>
    <clipPath id="winClip">
      <rect x="760" y="52" width="396" height="224" rx="16"/>
    </clipPath>
    <filter id="b24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="gsm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="12" stdDeviation="13" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <ellipse cx="220" cy="60" rx="380" ry="200" fill="url(#gV)" filter="url(#b24)"/>
  <ellipse cx="1030" cy="330" rx="340" ry="200" fill="url(#gT)" filter="url(#b24)"/>

  <rect x="0" y="24" width="1200" height="336" fill="#101019" opacity=".55"/>
  <rect x="0" y="24" width="1200" height="336" fill="url(#tiles)"/>

  <!-- окно с морем -->
  <g>
    <rect x="760" y="52" width="396" height="224" rx="16" fill="#07070f" stroke="#33334c" stroke-width="2"/>
    <g clip-path="url(#winClip)">
      <rect x="760" y="52" width="396" height="224" fill="url(#sky)"/>
      <circle cx="900" cy="146" r="34" fill="#4be1c4" opacity=".22"/>
      <circle cx="900" cy="146" r="20" fill="#c9fff4" opacity=".45"/>
      <rect x="760" y="198" width="396" height="78" fill="url(#sea)"/>
      <path d="M760 198 H1156" stroke="#4be1c4" stroke-opacity=".45" stroke-width="2"/>
      <g fill="none" stroke="#c9fff4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
        <path d="M790 222 q10 -6 20 0 t20 0"/>
        <path d="M846 238 q10 -6 20 0 t20 0"/>
        <path d="M918 226 q10 -6 20 0 t20 0"/>
        <path d="M982 248 q10 -6 20 0 t20 0"/>
        <path d="M1046 216 q10 -6 20 0 t20 0"/>
        <path d="M1104 242 q10 -6 20 0 t20 0"/>
      </g>
      <path d="M1030 236 l14 -22 l14 22 Z" fill="#c9fff4" opacity=".5"/>
      <path d="M1044 236 V258" stroke="#c9fff4" stroke-opacity=".5" stroke-width="2"/>
      <!-- пальма -->
      <path d="M1092 258 C1098 220 1096 186 1102 150" fill="none" stroke="#081016" stroke-width="9" stroke-linecap="round"/>
      <g fill="#081016">
        <path d="M1102 150 C1078 132 1058 134 1044 146 C1064 146 1082 152 1102 158 Z"/>
        <path d="M1102 150 C1126 130 1148 132 1160 144 C1140 144 1120 152 1102 158 Z"/>
        <path d="M1102 152 C1082 164 1070 182 1070 196 C1084 184 1094 172 1108 162 Z"/>
        <path d="M1102 152 C1122 166 1130 186 1128 200 C1116 184 1108 172 1096 162 Z"/>
        <path d="M1102 150 C1096 128 1102 112 1112 102 C1108 122 1110 138 1108 156 Z"/>
      </g>
    </g>
    <path d="M958 52 V276 M760 164 H1156" fill="none" stroke="#33334c" stroke-width="2"/>
    <ellipse cx="958" cy="320" rx="220" ry="30" fill="#4be1c4" opacity=".12" filter="url(#b10)"/>
  </g>

  <!-- календарь -->
  <g>
    <rect x="90" y="58" width="250" height="204" rx="16" fill="#1a1a28" stroke="#3d3d58" stroke-width="2"/>
    <path d="M106 58 H324 A16 16 0 0 1 340 74 V98 H90 V74 A16 16 0 0 1 106 58 Z" fill="#26263a"/>
    <rect x="112" y="70" width="96" height="9" rx="4.5" fill="#8b7cff" opacity=".8"/>
    <rect x="218" y="70" width="44" height="9" rx="4.5" fill="#4be1c4" opacity=".5"/>
    <g stroke="#4a4a68" stroke-width="5" stroke-linecap="round">
      <path d="M136 50 V68"/>
      <path d="M292 50 V68"/>
    </g>
    <rect x="108" y="104" width="210" height="120" fill="url(#days)"/>
    <rect x="168" y="134" width="24" height="20" rx="5" fill="#4be1c4" opacity=".25" stroke="#4be1c4" stroke-opacity=".7"/>
    <rect x="228" y="164" width="24" height="20" rx="5" fill="#8b7cff" opacity=".3" stroke="#8b7cff" stroke-opacity=".75"/>
    <path d="M174 144 l3 3 l6 -7" fill="none" stroke="#4be1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="240" cy="174" r="3" fill="#cbc6ff"/>
  </g>

  <!-- чемодан -->
  <g transform="translate(486 190) rotate(-4)" filter="url(#drop)">
    <ellipse cx="120" cy="158" rx="128" ry="16" fill="#000" opacity=".45"/>
    <path d="M78 -22 V-34 a42 42 0 0 1 84 0 V-22" fill="none" stroke="#4a4a68" stroke-width="9" stroke-linecap="round"/>
    <rect x="0" y="0" width="240" height="150" rx="18" fill="url(#case)" stroke="#4a4a68" stroke-width="2"/>
    <rect x="98" y="10" width="6" height="130" rx="3" fill="#4be1c4" opacity=".45"/>
    <rect x="20" y="22" width="46" height="46" rx="12" fill="#d94f6a"/>
    <rect x="38" y="30" width="10" height="30" rx="3" fill="#fff"/>
    <rect x="28" y="40" width="30" height="10" rx="3" fill="#fff"/>
    <g fill="#8b7cff" opacity=".7">
      <circle cx="176" cy="48" r="9"/>
      <path d="M188 92 l6 6 l12 -14" fill="none" stroke="#4be1c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="24" y="106" width="60" height="7" rx="3.5" fill="#4be1c4" opacity=".35"/>
    <rect x="24" y="120" width="40" height="7" rx="3.5" fill="#8b7cff" opacity=".35"/>
    <g stroke="#4a4a68" stroke-width="4" stroke-linecap="round">
      <path d="M34 150 V162"/>
      <path d="M206 150 V162"/>
    </g>
    <g transform="translate(236 12) rotate(14)">
      <path d="M0 0 V-22" stroke="#8b7cff" stroke-width="2"/>
      <rect x="-16" y="0" width="32" height="46" rx="7" fill="#1d1d2b" stroke="#4a4a68" stroke-width="1.5"/>
      <rect x="-9" y="9" width="18" height="5" rx="2.5" fill="#4be1c4" opacity=".7"/>
      <rect x="-9" y="19" width="12" height="5" rx="2.5" fill="#8b7cff" opacity=".7"/>
    </g>
  </g>

  <!-- стойка -->
  <g>
    <rect x="40" y="300" width="1120" height="22" rx="7" fill="#33334a"/>
    <rect x="46" y="316" width="1108" height="84" fill="url(#counter)"/>
    <rect x="46" y="316" width="1108" height="84" fill="url(#tiles)" opacity=".5"/>
    <rect x="66" y="330" width="126" height="34" rx="6" fill="#1f1f30" stroke="#3d3d58"/>
    <rect x="212" y="330" width="96" height="34" rx="6" fill="#1b1b2a" stroke="#3d3d58"/>
    <rect x="946" y="330" width="106" height="34" rx="6" fill="#1b1b2a" stroke="#3d3d58"/>
    <rect x="1072" y="330" width="64" height="34" rx="6" fill="#1f1f30" stroke="#3d3d58"/>
  </g>

  <rect x="0" y="334" width="1200" height="66" fill="url(#floor)"/>
  <g opacity=".14" filter="url(#b10)">
    <rect x="760" y="336" width="396" height="46" fill="#4be1c4"/>
    <rect x="90" y="336" width="250" height="40" fill="#8b7cff"/>
    <rect x="486" y="336" width="240" height="40" fill="#8b7cff"/>
  </g>

  <g fill="#4be1c4">
    <circle cx="408" cy="150" r="2" opacity=".5"/>
    <circle cx="700" cy="96" r="1.6" opacity=".4"/>
    <circle cx="380" cy="286" r="1.8" opacity=".4"/>
    <circle cx="1160" cy="300" r="1.5" opacity=".35"/>
  </g>
  <g fill="#8b7cff" opacity=".55">
    <circle cx="440" cy="82" r="1.6"/>
    <circle cx="1180" cy="196" r="1.4"/>
    <circle cx="66" cy="300" r="1.4"/>
  </g>
</svg>
