<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Отделение ПСЭС: больница ночью">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a13"/>
      <stop offset="1" stop-color="#161624"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b3e"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="risalit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323247"/>
      <stop offset="1" stop-color="#1a1a27"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2ff"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <linearGradient id="winT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfff7"/>
      <stop offset="1" stop-color="#4be1c4"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7adff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b15" stop-opacity="0"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>
    <pattern id="facade" width="32" height="36" patternUnits="userSpaceOnUse">
      <rect x="7" y="9" width="18" height="20" rx="3" fill="#8b7cff" opacity=".14"/>
    </pattern>
    <pattern id="facadeT" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="5" y="8" width="16" height="18" rx="3" fill="#4be1c4" opacity=".12"/>
    </pattern>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <ellipse cx="130" cy="58" rx="250" ry="155" fill="url(#glowV)" filter="url(#blur24)"/>
  <ellipse cx="546" cy="318" rx="240" ry="150" fill="url(#glowT)" filter="url(#blur24)"/>

  <g fill="#ffffff" opacity=".45">
    <circle cx="68" cy="40" r="1.2"/>
    <circle cx="124" cy="88" r="1"/>
    <circle cx="212" cy="32" r="1.4"/>
    <circle cx="332" cy="24" r="1"/>
    <circle cx="472" cy="50" r="1.2"/>
    <circle cx="562" cy="28" r="1"/>
    <circle cx="604" cy="94" r="1.3"/>
    <circle cx="34" cy="122" r="1"/>
  </g>

  <g opacity=".5">
    <rect x="88" y="158" width="128" height="142" rx="8" fill="#1a1a28" stroke="#303045" stroke-width="1.5"/>
    <rect x="96" y="168" width="112" height="122" fill="url(#facade)" opacity=".8"/>
  </g>

  <rect x="200" y="104" width="252" height="196" rx="12" fill="url(#bldg)" stroke="#3b3b52" stroke-width="1.5"/>
  <rect x="212" y="120" width="228" height="168" fill="url(#facade)"/>

  <rect x="286" y="62" width="80" height="238" rx="10" fill="url(#risalit)" stroke="#41415b" stroke-width="1.5"/>
  <rect x="294" y="86" width="64" height="200" fill="url(#facadeT)"/>

  <g filter="url(#glowSm)">
    <rect x="310" y="20" width="32" height="32" rx="9" fill="#d94f6a"/>
    <rect x="322.5" y="26" width="7" height="20" rx="2" fill="#fff"/>
    <rect x="316" y="32.5" width="20" height="7" rx="2" fill="#fff"/>
  </g>

  <g fill="url(#win)">
    <rect x="220" y="128" width="18" height="22" rx="3"/>
    <rect x="252" y="128" width="18" height="22" rx="3"/>
    <rect x="220" y="200" width="18" height="22" rx="3"/>
    <rect x="412" y="128" width="18" height="22" rx="3"/>
    <rect x="412" y="200" width="18" height="22" rx="3" opacity=".75"/>
    <rect x="380" y="236" width="18" height="22" rx="3" opacity=".55"/>
  </g>
  <g fill="url(#winT)">
    <rect x="302" y="98" width="16" height="20" rx="3"/>
    <rect x="334" y="98" width="16" height="20" rx="3" opacity=".8"/>
    <rect x="302" y="168" width="16" height="20" rx="3" opacity=".7"/>
    <rect x="334" y="204" width="16" height="20" rx="3" opacity=".55"/>
  </g>

  <rect x="306" y="238" width="40" height="62" rx="5" fill="#0c0c15"/>
  <rect x="309" y="241" width="34" height="56" rx="4" fill="url(#door)"/>
  <ellipse cx="326" cy="302" rx="86" ry="17" fill="url(#glowT)" filter="url(#blur10)" opacity=".55"/>

  <g transform="translate(64 244)">
    <ellipse cx="60" cy="46" rx="58" ry="9" fill="#000" opacity=".45"/>
    <path d="M4 26 h58 v-12 a5 5 0 0 0 -5 -5 h-18 l-11 -9 h-19 a5 5 0 0 0 -5 5 z" fill="#11111c" stroke="#3c3c56" stroke-width="1.5"/>
    <path d="M62 9 h12 a6 6 0 0 1 6 6 v11 h-18 z" fill="#161622" stroke="#3c3c56" stroke-width="1.5"/>
    <rect x="70" y="13" width="8" height="7" rx="2" fill="#8b7cff" opacity=".7"/>
    <rect x="18" y="12" width="12" height="12" rx="2" fill="#0a0a12" stroke="#4be1c4" stroke-opacity=".5"/>
    <g fill="#e9eaf6">
      <rect x="22.5" y="14" width="3" height="8" rx="1"/>
      <rect x="20" y="16.5" width="8" height="3" rx="1"/>
    </g>
    <circle cx="22" cy="30" r="7.5" fill="#07070c" stroke="#3c3c56" stroke-width="1.5"/>
    <circle cx="64" cy="30" r="7.5" fill="#07070c" stroke="#3c3c56" stroke-width="1.5"/>
    <circle cx="82" cy="18" r="3.5" fill="#8ffff0"/>
    <ellipse cx="84" cy="18" rx="16" ry="8" fill="#4be1c4" opacity=".22" filter="url(#blur10)"/>
  </g>

  <rect x="0" y="292" width="640" height="68" fill="url(#ground)"/>
  <ellipse cx="326" cy="306" rx="250" ry="42" fill="#8b7cff" opacity=".07" filter="url(#blur24)"/>

  <polyline points="18,336 96,336 116,336 128,322 140,350 154,306 168,344 182,336 250,336 470,336 500,336 512,326 524,344 536,336 622,336"
    fill="none" stroke="#4be1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    opacity=".35" filter="url(#glowSm)"/>
</svg>
