<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Кабинет отдела ПСЭС: доска с расписанием проверок, планшет с чек-листом и печать">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090911"/>
      <stop offset="1" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="gV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="1" stop-color="#0c0c15"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b40"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f3fa"/>
      <stop offset="1" stop-color="#d8dae9"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#5b4be0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b14" stop-opacity="0"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <pattern id="tiles" width="72" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 0 H72 M0 0 V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="b24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="gsm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <ellipse cx="220" cy="60" rx="380" ry="200" fill="url(#gV)" filter="url(#b24)"/>
  <ellipse cx="1030" cy="330" rx="340" ry="200" fill="url(#gT)" filter="url(#b24)"/>

  <rect x="0" y="24" width="1200" height="336" fill="#101019" opacity=".55"/>
  <rect x="0" y="24" width="1200" height="336" fill="url(#tiles)"/>

  <g fill="#ffffff" opacity=".34">
    <circle cx="152" cy="42" r="1.2"/>
    <circle cx="452" cy="34" r="1"/>
    <circle cx="742" cy="52" r="1.1"/>
    <circle cx="880" cy="40" r="1"/>
    <circle cx="1148" cy="96" r="1.2"/>
  </g>

  <!-- окно с ночным городом -->
  <g>
    <rect x="928" y="52" width="240" height="212" rx="14" fill="#07070f" stroke="#33334c" stroke-width="2"/>
    <circle cx="1052" cy="96" r="19" fill="#4be1c4" opacity=".16"/>
    <circle cx="1052" cy="96" r="11" fill="#c9fff4" opacity=".34"/>
    <g fill="#111122">
      <rect x="944" y="168" width="40" height="78"/>
      <rect x="992" y="142" width="32" height="104"/>
      <rect x="1032" y="182" width="46" height="64"/>
      <rect x="1086" y="156" width="28" height="90"/>
      <rect x="1122" y="192" width="34" height="54"/>
    </g>
    <g fill="#8b7cff" opacity=".55">
      <rect x="952" y="180" width="7" height="9"/>
      <rect x="966" y="196" width="7" height="9"/>
      <rect x="998" y="156" width="7" height="9"/>
      <rect x="1012" y="176" width="7" height="9"/>
      <rect x="1040" y="194" width="7" height="9"/>
      <rect x="1092" y="170" width="7" height="9"/>
    </g>
    <g fill="#4be1c4" opacity=".5">
      <rect x="966" y="222" width="7" height="9"/>
      <rect x="1052" y="208" width="7" height="9"/>
      <rect x="1130" y="206" width="7" height="9"/>
    </g>
    <path d="M1048 52 V264 M928 158 H1168" fill="none" stroke="#33334c" stroke-width="2"/>
  </g>

  <!-- доска с расписанием -->
  <g>
    <rect x="70" y="54" width="430" height="216" rx="16" fill="url(#board)" stroke="#3d3d58" stroke-width="2"/>
    <path d="M86 54 H484 A16 16 0 0 1 500 70 V90 H70 V70 A16 16 0 0 1 86 54 Z" fill="#1b1b2a"/>
    <rect x="86" y="64" width="118" height="9" rx="4.5" fill="#8b7cff" opacity=".8"/>
    <rect x="214" y="64" width="52" height="9" rx="4.5" fill="#4be1c4" opacity=".5"/>
    <g fill="#4a4a68">
      <circle cx="452" cy="69" r="4"/>
      <circle cx="464" cy="69" r="4"/>
      <circle cx="476" cy="69" r="4"/>
    </g>

    <!-- подсвеченная строка -->
    <rect x="82" y="150" width="406" height="26" rx="8" fill="#4be1c4" opacity=".08"/>
    <rect x="82" y="150" width="406" height="26" rx="8" fill="none" stroke="#4be1c4" stroke-opacity=".3"/>

    <g>
      <rect x="88" y="106" width="26" height="18" rx="5" fill="#222233"/>
      <rect x="122" y="112" width="166" height="6" rx="3" fill="#2c2c42"/>
      <rect x="302" y="112" width="42" height="6" rx="3" fill="#4be1c4" opacity=".75"/>
      <circle cx="362" cy="115" r="4" fill="#4be1c4" opacity=".7"/>
      <rect x="378" y="112" width="94" height="6" rx="3" fill="#26263a"/>

      <rect x="88" y="130" width="26" height="18" rx="5" fill="#222233"/>
      <rect x="122" y="136" width="130" height="6" rx="3" fill="#2c2c42"/>
      <rect x="302" y="136" width="42" height="6" rx="3" fill="#4be1c4" opacity=".75"/>
      <circle cx="362" cy="139" r="4" fill="#8b7cff" opacity=".7"/>
      <rect x="378" y="136" width="72" height="6" rx="3" fill="#26263a"/>

      <rect x="92" y="158" width="20" height="12" rx="4" fill="#4be1c4" opacity=".25"/>
      <rect x="122" y="160" width="148" height="6" rx="3" fill="#9a8cff" opacity=".65"/>
      <rect x="302" y="160" width="42" height="6" rx="3" fill="#4be1c4"/>
      <path d="M356 159 l4 4 l7 -8" fill="none" stroke="#4be1c4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="160" width="88" height="6" rx="3" fill="#33334c"/>

      <rect x="88" y="178" width="26" height="18" rx="5" fill="#222233"/>
      <rect x="122" y="184" width="154" height="6" rx="3" fill="#2c2c42"/>
      <rect x="302" y="184" width="42" height="6" rx="3" fill="#4be1c4" opacity=".75"/>
      <circle cx="362" cy="187" r="4" fill="#8b7cff" opacity=".7"/>
      <rect x="378" y="184" width="100" height="6" rx="3" fill="#26263a"/>

      <rect x="88" y="202" width="26" height="18" rx="5" fill="#222233"/>
      <rect x="122" y="208" width="120" height="6" rx="3" fill="#2c2c42"/>
      <rect x="302" y="208" width="42" height="6" rx="3" fill="#4be1c4" opacity=".75"/>
      <circle cx="362" cy="211" r="4" fill="#4be1c4" opacity=".55"/>
      <rect x="378" y="208" width="80" height="6" rx="3" fill="#26263a"/>

      <rect x="88" y="226" width="26" height="18" rx="5" fill="#222233"/>
      <rect x="122" y="232" width="176" height="6" rx="3" fill="#2c2c42"/>
      <rect x="302" y="232" width="42" height="6" rx="3" fill="#4be1c4" opacity=".75"/>
      <circle cx="362" cy="235" r="4" fill="#8b7cff" opacity=".55"/>
      <rect x="378" y="232" width="90" height="6" rx="3" fill="#26263a"/>
    </g>
  </g>

  <!-- лампа -->
  <g stroke="#3d3d58" stroke-width="3" stroke-linecap="round">
    <path d="M600 0 V70"/>
  </g>
  <path d="M556 70 H644 L622 112 H578 Z" fill="#26263a" stroke="#414160" stroke-width="2"/>
  <ellipse cx="600" cy="116" rx="16" ry="9" fill="#4be1c4" opacity=".5" filter="url(#b10)"/>
  <ellipse cx="600" cy="312" rx="210" ry="86" fill="#4be1c4" opacity=".1" filter="url(#b24)"/>

  <!-- стойка -->
  <g>
    <rect x="40" y="300" width="1120" height="22" rx="7" fill="#33334a"/>
    <rect x="46" y="316" width="1108" height="84" fill="url(#counter)"/>
    <rect x="46" y="316" width="1108" height="84" fill="url(#tiles)" opacity=".5"/>
    <rect x="66" y="330" width="126" height="34" rx="6" fill="#1f1f30" stroke="#3d3d58"/>
    <rect x="212" y="330" width="96" height="34" rx="6" fill="#1b1b2a" stroke="#3d3d58"/>
    <rect x="946" y="330" width="106" height="34" rx="6" fill="#1b1b2a" stroke="#3d3d58"/>
    <rect x="1072" y="330" width="64" height="34" rx="6" fill="#1f1f30" stroke="#3d3d58"/>
  </g>

  <!-- планшет с чек-листом -->
  <g transform="translate(452 182) rotate(-6)" filter="url(#drop)">
    <rect x="0" y="0" width="214" height="160" rx="15" fill="#20202f" stroke="#3d3d56" stroke-width="1.5"/>
    <rect x="13" y="20" width="188" height="128" rx="9" fill="url(#paper)"/>
    <rect x="72" y="-8" width="70" height="28" rx="10" fill="url(#stamp)" stroke="#1b1b28" stroke-width="1.5"/>
    <rect x="90" y="3" width="34" height="7" rx="3.5" fill="#12121b"/>

    <rect x="32" y="36" width="96" height="9" rx="4.5" fill="#9a9cb8"/>
    <rect x="32" y="52" width="132" height="5" rx="2.5" fill="#c3c4d6"/>

    <g>
      <rect x="30" y="74" width="10" height="10" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.5"/>
      <path d="M32.5 79 l2.4 2.4 l4.2 -5" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="77" width="112" height="5" rx="2.5" fill="#c9cadb"/>

      <rect x="30" y="96" width="10" height="10" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.5"/>
      <path d="M32.5 101 l2.4 2.4 l4.2 -5" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="99" width="96" height="5" rx="2.5" fill="#c9cadb"/>

      <rect x="30" y="118" width="10" height="10" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.5"/>
      <rect x="48" y="121" width="70" height="5" rx="2.5" fill="#dcdde8"/>
    </g>

    <g transform="translate(152 116) rotate(-10)">
      <circle r="24" fill="none" stroke="#6f5cf5" stroke-width="2.4" opacity=".8"/>
      <circle r="18" fill="none" stroke="#6f5cf5" stroke-width="1.2" stroke-dasharray="3 4" opacity=".65"/>
      <path d="M-8 1 l6 7 l11 -14" fill="none" stroke="#6f5cf5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- лупа -->
  <g>
    <circle cx="700" cy="262" r="46" fill="#4be1c4" opacity=".07"/>
    <circle cx="700" cy="262" r="46" fill="none" stroke="#cfc9ff" stroke-width="5"/>
    <path d="M712 250 a30 30 0 0 1 8 26" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    <path d="M733 296 L782 342" stroke="#3d3d58" stroke-width="15" stroke-linecap="round"/>
    <path d="M733 296 L782 342" stroke="#9a8cff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- печать -->
  <g transform="translate(862 208) rotate(10)" filter="url(#drop)">
    <rect x="-11" y="0" width="22" height="62" rx="10" fill="#2c2c42"/>
    <rect x="-6" y="8" width="4" height="46" rx="2" fill="#ffffff" opacity=".16"/>
    <rect x="-30" y="60" width="60" height="14" rx="5" fill="#3d3d58"/>
    <rect x="-44" y="72" width="88" height="18" rx="6" fill="#26263a" stroke="#4a4a68" stroke-width="1.5"/>
    <rect x="-40" y="88" width="80" height="10" rx="4" fill="url(#stamp)"/>
  </g>

  <!-- рация -->
  <g transform="translate(996 188)" filter="url(#drop)">
    <path d="M30 2 L42 -38" stroke="#3d3d58" stroke-width="4" stroke-linecap="round"/>
    <rect x="0" y="0" width="78" height="124" rx="14" fill="#222233" stroke="#414160" stroke-width="1.5"/>
    <rect x="10" y="12" width="58" height="44" rx="7" fill="#15151f" stroke="#3d3d56"/>
    <g fill="#3a3a52">
      <rect x="18" y="20" width="42" height="3" rx="1.5"/>
      <rect x="18" y="28" width="42" height="3" rx="1.5"/>
      <rect x="18" y="36" width="42" height="3" rx="1.5"/>
      <rect x="18" y="44" width="28" height="3" rx="1.5"/>
    </g>
    <circle cx="20" cy="76" r="6" fill="#4be1c4" filter="url(#gsm)"/>
    <rect x="36" y="70" width="30" height="12" rx="3" fill="#2c2c42"/>
    <circle cx="22" cy="100" r="9" fill="#2c2c42" stroke="#4a4a68" stroke-width="1.5"/>
    <circle cx="22" cy="100" r="3" fill="#8b7cff"/>
    <g fill="none" stroke="#4be1c4" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
      <path d="M88 20 a16 16 0 0 1 0 22"/>
      <path d="M98 10 a30 30 0 0 1 0 42"/>
    </g>
  </g>

  <rect x="0" y="334" width="1200" height="66" fill="url(#floor)"/>
  <g opacity=".14" filter="url(#b10)">
    <rect x="928" y="336" width="240" height="46" fill="#4be1c4"/>
    <rect x="70" y="336" width="430" height="40" fill="#8b7cff"/>
    <rect x="996" y="336" width="78" height="40" fill="#4be1c4"/>
  </g>

  <g fill="#4be1c4">
    <circle cx="846" cy="128" r="2" opacity=".5"/>
    <circle cx="540" cy="140" r="1.6" opacity=".4"/>
    <circle cx="930" cy="322" r="1.6" opacity=".35"/>
    <circle cx="330" cy="292" r="1.8" opacity=".4"/>
  </g>
</svg>
