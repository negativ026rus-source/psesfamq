<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Печать проверки и радиоволны">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4be1c4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="7 9"/>
  <circle cx="120" cy="120" r="66" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".7"/>

  <g filter="url(#soft)">
    <path d="M106 68 h28 v30 h30 v28 h-30 v30 h-28 v-30 H76 V98 h30 Z" fill="url(#cross)" opacity=".9"/>
  </g>

  <g fill="none" stroke="#4be1c4" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round">
    <path d="M176 58 a28 28 0 0 1 0 40"/>
    <path d="M188 44 a44 44 0 0 1 0 68"/>
  </g>

  <g transform="translate(160 158)">
    <circle r="26" fill="#0b0b13" fill-opacity=".6" stroke="#4be1c4" stroke-opacity=".5" stroke-width="1.6"/>
    <path d="M-10 0 l7 8 l13 -16" fill="none" stroke="#4be1c4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#4be1c4">
    <circle cx="52" cy="70" r="1.8" opacity=".5"/>
    <circle cx="196" cy="186" r="1.6" opacity=".4"/>
    <circle cx="64" cy="188" r="1.5" opacity=".45"/>
  </g>
</svg>
