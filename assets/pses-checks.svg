<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Проверки отчётов и документации ПСЭС">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a13"/>
      <stop offset="1" stop-color="#151523"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#5b4be0"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3b55"/>
      <stop offset=".5" stop-color="#cfc9ff"/>
      <stop offset="1" stop-color="#6f5cf5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121c"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <ellipse cx="150" cy="40" rx="240" ry="150" fill="url(#glowV)" filter="url(#blur24)"/>
  <ellipse cx="540" cy="320" rx="240" ry="160" fill="url(#glowT)" filter="url(#blur24)"/>

  <g fill="#ffffff" opacity=".4">
    <circle cx="86" cy="46" r="1.2"/>
    <circle cx="236" cy="28" r="1"/>
    <circle cx="420" cy="34" r="1.3"/>
    <circle cx="560" cy="58" r="1"/>
    <circle cx="606" cy="124" r="1.2"/>
    <circle cx="36" cy="102" r="1"/>
    <circle cx="330" cy="14" r="1"/>
  </g>

  <path d="M0 268 L640 244 L640 360 L0 360 Z" fill="url(#desk)"/>
  <path d="M0 268 L640 244" fill="none" stroke="#30304a" stroke-width="1.5"/>

  <ellipse cx="252" cy="196" rx="150" ry="120" fill="#8b7cff" opacity=".13" filter="url(#blur24)"/>

  <g transform="translate(148 42) rotate(-6)" filter="url(#shadow)">
    <rect x="0" y="0" width="204" height="272" rx="16" fill="#20202f" stroke="#3d3d56" stroke-width="1.5"/>
    <rect x="12" y="18" width="180" height="242" rx="9" fill="#e8e9f3"/>

    <rect x="72" y="-13" width="60" height="30" rx="11" fill="url(#clipGrad)" stroke="#1b1b28" stroke-width="1.5"/>
    <rect x="88" y="1" width="28" height="8" rx="4" fill="#12121b"/>

    <rect x="32" y="38" width="92" height="10" rx="5" fill="#b7b8ce"/>
    <rect x="32" y="56" width="128" height="6" rx="3" fill="#d4d5e3"/>

    <g>
      <rect x="30" y="82" width="11" height="11" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.6"/>
      <path d="M33 88 l2.6 2.6 l4.6 -5.4" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="85" width="112" height="6" rx="3" fill="#cbccdc"/>

      <rect x="30" y="108" width="11" height="11" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.6"/>
      <path d="M33 114 l2.6 2.6 l4.6 -5.4" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="111" width="94" height="6" rx="3" fill="#cbccdc"/>

      <rect x="30" y="134" width="11" height="11" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.6"/>
      <path d="M33 140 l2.6 2.6 l4.6 -5.4" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="137" width="124" height="6" rx="3" fill="#cbccdc"/>

      <rect x="30" y="160" width="11" height="11" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.6"/>
      <path d="M33 166 l2.6 2.6 l4.6 -5.4" fill="none" stroke="#6f5cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="163" width="86" height="6" rx="3" fill="#cbccdc"/>

      <rect x="30" y="186" width="11" height="11" rx="3" fill="none" stroke="#b4b5c9" stroke-width="1.6"/>
      <rect x="50" y="189" width="106" height="6" rx="3" fill="#dcdee9"/>
    </g>

    <g transform="translate(126 196) rotate(-12)">
      <circle r="34" fill="none" stroke="#6f5cf5" stroke-width="3" opacity=".85"/>
      <circle r="26" fill="none" stroke="#6f5cf5" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
      <path d="M-11 1 l8 9 l15 -19" fill="none" stroke="#6f5cf5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <ellipse cx="102" cy="246" rx="70" ry="9" fill="#8b7cff" opacity=".12"/>
  </g>

  <g transform="translate(452 132) rotate(20)">
    <rect x="0" y="0" width="18" height="164" rx="9" fill="url(#penGrad)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="3.5" y="10" width="4" height="128" rx="2" fill="#ffffff" opacity=".22"/>
    <path d="M0 164 L9 184 L18 164 Z" fill="#dcd6ff"/>
    <path d="M6.5 174 L9 184 L11.5 174 Z" fill="#4b3fd1"/>
    <rect x="0" y="0" width="18" height="36" rx="9" fill="#2c2c42"/>
    <rect x="0" y="34" width="18" height="3" fill="#4b3fd1" opacity=".9"/>
  </g>

  <g fill="#4be1c4">
    <circle cx="470" cy="96" r="2" opacity=".55"/>
    <circle cx="512" cy="288" r="1.6" opacity=".45"/>
    <circle cx="96" cy="286" r="1.8" opacity=".4"/>
    <circle cx="588" cy="180" r="1.4" opacity=".5"/>
  </g>
</svg>
