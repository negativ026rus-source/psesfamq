<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Чемодан с медицинским крестом, пальма и море">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a13"/>
      <stop offset="1" stop-color="#151523"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be1c4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4be1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e46"/>
      <stop offset="1" stop-color="#171724"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6f74"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121c"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <ellipse cx="150" cy="40" rx="240" ry="150" fill="url(#glowV)" filter="url(#blur24)"/>
  <ellipse cx="540" cy="320" rx="240" ry="160" fill="url(#glowT)" filter="url(#blur24)"/>

  <!-- солнце -->
  <circle cx="110" cy="106" r="44" fill="#4be1c4" opacity=".14" filter="url(#blur10)"/>
  <circle cx="110" cy="106" r="26" fill="#4be1c4" opacity=".28"/>
  <circle cx="110" cy="106" r="15" fill="#c9fff4" opacity=".5"/>

  <!-- море и стойка -->
  <rect x="0" y="252" width="640" height="44" fill="url(#sea)" opacity=".8"/>
  <path d="M0 252 H640" stroke="#4be1c4" stroke-opacity=".4" stroke-width="1.5"/>
  <g fill="none" stroke="#c9fff4" stroke-opacity=".3" stroke-width="1.8" stroke-linecap="round">
    <path d="M28 268 q8 -5 16 0 t16 0"/>
    <path d="M92 280 q8 -5 16 0 t16 0"/>
    <path d="M540 270 q8 -5 16 0 t16 0"/>
    <path d="M584 286 q8 -5 16 0 t16 0"/>
  </g>
  <path d="M0 292 L640 272 L640 360 L0 360 Z" fill="url(#desk)"/>
  <path d="M0 292 L640 272" fill="none" stroke="#30304a" stroke-width="1.5"/>

  <!-- пальма -->
  <g transform="translate(536 92)">
    <path d="M16 150 C22 108 18 74 24 40" fill="none" stroke="#0d1a22" stroke-width="8" stroke-linecap="round"/>
    <g fill="#0d1a22">
      <path d="M24 40 C2 24 -16 26 -30 38 C-8 38 8 44 24 48 Z"/>
      <path d="M24 40 C46 22 66 24 78 36 C58 36 40 44 24 48 Z"/>
      <path d="M24 42 C6 54 -4 72 -4 86 C8 74 16 62 30 52 Z"/>
      <path d="M24 42 C42 56 50 76 48 90 C38 74 30 62 20 52 Z"/>
      <path d="M24 40 C18 18 24 2 34 -8 C30 12 32 28 30 46 Z"/>
    </g>
  </g>

  <!-- чемодан -->
  <g transform="translate(204 108) rotate(-6)" filter="url(#shadow)">
    <ellipse cx="120" cy="176" rx="140" ry="16" fill="#000" opacity=".45"/>
    <path d="M80 -20 V-34 a40 40 0 0 1 80 0 V-20" fill="none" stroke="#4a4a68" stroke-width="9" stroke-linecap="round"/>
    <rect x="0" y="0" width="244" height="168" rx="20" fill="url(#case)" stroke="#4a4a68" stroke-width="2"/>
    <rect x="100" y="12" width="6" height="144" rx="3" fill="#4be1c4" opacity=".45"/>
    <rect x="22" y="26" width="52" height="52" rx="13" fill="#d94f6a"/>
    <rect x="42" y="35" width="11" height="34" rx="3.5" fill="#fff"/>
    <rect x="31" y="46" width="34" height="11" rx="3.5" fill="#fff"/>
    <g fill="#8b7cff" opacity=".72">
      <circle cx="182" cy="54" r="10"/>
      <path d="M192 104 l7 7 l14 -16" fill="none" stroke="#4be1c4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="26" y="118" width="66" height="8" rx="4" fill="#4be1c4" opacity=".35"/>
    <rect x="26" y="134" width="44" height="8" rx="4" fill="#8b7cff" opacity=".35"/>
    <g stroke="#4a4a68" stroke-width="4" stroke-linecap="round">
      <path d="M36 168 V182"/>
      <path d="M208 168 V182"/>
    </g>
    <g transform="translate(240 12) rotate(14)">
      <path d="M0 0 V-24" stroke="#8b7cff" stroke-width="2"/>
      <rect x="-17" y="0" width="34" height="50" rx="8" fill="#1d1d2b" stroke="#4a4a68" stroke-width="1.5"/>
      <rect x="-10" y="10" width="20" height="5" rx="2.5" fill="#4be1c4" opacity=".7"/>
      <rect x="-10" y="21" width="13" height="5" rx="2.5" fill="#8b7cff" opacity=".7"/>
    </g>
  </g>

  <g fill="#4be1c4">
    <circle cx="400" cy="72" r="2" opacity=".55"/>
    <circle cx="470" cy="300" r="1.6" opacity=".45"/>
    <circle cx="70" cy="220" r="1.8" opacity=".4"/>
    <circle cx="596" cy="150" r="1.4" opacity=".5"/>
  </g>
  <g fill="#8b7cff" opacity=".55">
    <circle cx="340" cy="44" r="1.5"/>
    <circle cx="618" cy="236" r="1.4"/>
    <circle cx="44" cy="170" r="1.3"/>
  </g>
</svg>
