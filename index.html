<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор баллов ПСЭС</title>
  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px Arial, sans-serif;
      color: #eee;
      background: #171923;
    }
    h1 { color: #9cc2ff; }
    label { display: block; margin: 14px 0; }
    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #44495d;
      border-radius: 7px;
      color: #fff;
      background: #222638;
    }
    .activity {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      align-items: end;
      margin: 10px 0;
    }
    button {
      margin: 14px 8px 14px 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }
    #copy { color: white; background: #426fe0; }
    #result {
      white-space: pre-wrap;
      padding: 16px;
      border-radius: 8px;
      background: #222638;
    }
    .hint { color: #b4b8c8; font-size: 14px; }
    @media (max-width: 520px) {
      .activity { grid-template-columns: 1fr 1fr; }
      .activity label:first-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <h1>Калькулятор баллов ПСЭС</h1>
  <p class="hint">Укажите количество выполненных действий и баллы за одно действие.</p>

  <label>
    Имя и фамилия
    <input id="name" placeholder="Например: Иван Иванов">
  </label>

  <label>
    Ранг / должность
    <input id="rank" placeholder="Например: Сотрудник">
  </label>

  <h2>Выполненные действия</h2>
  <div id="activities"></div>

  <button type="button" onclick="addActivity()">＋ Добавить действие</button>

  <label>
    Минимум баллов для недельного отчёта
    <input id="weeklyMin" type="number" min="0" value="10">
  </label>

  <label>
    Баллов нужно для повышения
    <input id="promotionMin" type="number" min="0" value="30">
  </label>

  <label>
    <input id="submitted" type="checkbox" style="width:auto">
    Отчёт уже отправлен в Discord
  </label>

  <h2>Результат</h2>
  <div id="result"></div>
  <button id="copy" type="button">Скопировать для Discord</button>

  <script>
    const activities = document.getElementById("activities");

    function addActivity(title = "", count = 0, points = 1) {
      const row = document.createElement("div");
      row.className = "activity";
      row.innerHTML = `
        <label>Действие
          <input class="title" placeholder="Например: Проведён инструктаж"
                 value="${title}">
        </label>
        <label>Количество
          <input class="count" type="number" min="0" value="${count}">
        </label>
        <label>Баллов за одно
          <input class="points" type="number" min="0" value="${points}">
        </label>`;
      activities.appendChild(row);
      row.querySelectorAll("input").forEach(input =>
        input.addEventListener("input", update)
      );
      update();
    }

    function update() {
      let total = 0;
      const lines = [];

      document.querySelectorAll(".activity").forEach(row => {
        const title = row.querySelector(".title").value.trim();
        const count = Number(row.querySelector(".count").value) || 0;
        const points = Number(row.querySelector(".points").value) || 0;
        const subtotal = count * points;

        total += subtotal;
        if (title && count > 0) {
          lines.push(`• ${title}: ${count} × ${points} = ${subtotal} балл.`);
        }
      });

      const weeklyMin = Number(document.getElementById("weeklyMin").value) || 0;
      const promotionMin = Number(document.getElementById("promotionMin").value) || 0;
      const submitted = document.getElementById("submitted").checked;
      const name = document.getElementById("name").value.trim() || "Не указано";
      const rank = document.getElementById("rank").value.trim() || "Не указано";

      const reportStatus = total >= weeklyMin
        ? "Норма баллов выполнена"
        : `Не хватает ${weeklyMin - total} балл. до недельной нормы`;

      const submissionStatus = submitted
        ? "Отчёт отправлен"
        : "Отчёт не отправлен";

      const promotionStatus = total >= promotionMin
        ? "Баллов для повышения набрано"
        : `До порога повышения: ${promotionMin - total} балл.`;

      const text =
`**Недельный отчёт ПСЭС**
Сотрудник: ${name}
Ранг: ${rank}

${lines.length ? lines.join("\n") : "• Действия пока не указаны"}

**Всего баллов: ${total}**
Недельная норма: ${reportStatus}
Статус отчёта: ${submissionStatus}
Повышение: ${promotionStatus}`;

      document.getElementById("result").textContent = text;
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById("copy").textContent = "Скопировано!";
          setTimeout(() => {
            document.getElementById("copy").textContent =
              "Скопировать для Discord";
          }, 1500);
        } catch {
          alert("Не удалось скопировать. Выделите текст результата и скопируйте вручную.");
        }
      };
    }

    document.querySelectorAll("#name, #rank, #weeklyMin, #promotionMin, #submitted")
      .forEach(input => input.addEventListener("input", update));
    document.getElementById("submitted").addEventListener("change", update);

    addActivity("Действие 1", 0, 1);
    addActivity("Действие 2", 0, 1);
  </script>
</body>
</html>
