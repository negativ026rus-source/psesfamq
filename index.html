<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ПСЭС — панель инструментов</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      color: #fff;
      background: #080b11;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #a7adba;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      min-height: 215px;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid #454956;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 85% 15%, rgba(131, 88, 210, .35), transparent 48%),
        linear-gradient(135deg, #333744, #191c25 75%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #9b81ff;
    }

    .icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 12px;
      background: #7654df;
      font-size: 23px;
    }

    .card h2 {
      margin: 20px 0 6px;
      font-size: 23px;
    }

    .card p {
      margin: 0;
      color: #d0d2da;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      align-self: flex-start;
      margin-top: 18px;
      padding: 11px 16px;
      border-radius: 9px;
      background: #7654df;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 500px) {
      body { padding: 20px 14px; }
      .card { min-height: 195px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Панель инструментов ПСЭС</h1>
    <p class="subtitle">Выберите нужный раздел</p>

    <section class="cards">
      <a class="card" href="calculator.html">
        <span class="icon">✚</span>
        <div>
          <h2>Калькулятор ПСЭС</h2>
          <p>Расчёт баллов, дежурств и требований к отчёту</p>
        </div>
        <span class="button">Перейти →</span>
      </a>

      <a class="card" href="checks.html">
        <span class="icon">◆</span>
        <div>
          <h2>Информация о проверках</h2>
          <p>Расписание проверок организаций ПСЭС</p>
        </div>
        <span class="button">Перейти →</span>
      </a>
    </section>
  </main>
</body>
</html>
